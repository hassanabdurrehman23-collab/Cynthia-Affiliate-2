<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crystal's Affiliate Network — REALO Pros</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --border: #e6e8ee;
    --text: #1b1f2a;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-soft: #eef2ff;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .test-banner {
    background: #ecfdf5;
    color: #065f46;
    text-align: center;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    border-bottom: 1px solid #a7f3d0;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-meta { font-size: 12px; color: var(--muted); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    color: white; font-weight: 700; font-size: 13px;
    background: linear-gradient(135deg, #ec4899, #7c3aed);
  }

  .container { max-width: 1280px; margin: 0 auto; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 24px; }

  .page-head { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .page-head h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  .tier-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    margin-left: 8px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
  }
  .campaign-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    margin-top: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }
